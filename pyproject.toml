[project]
name = "bmscriptsbox"
version = "1.6.0"
description = "BmScriptsBox - Windows跨语言脚本调度与管理软件"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT + Commons Clause"
authors = [
    {name = "綦恒智", email = "bmscriptsbox@163.com"}
]
keywords = ["script-manager", "automation", "hotkey", "workflow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Desktop Environment :: Window Managers",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "PySide6-Essentials>=6.8,<6.9",
    "xsideui>=2.1.1",
    "flask==3.0.3",
    "requests==2.32.4",
    "peewee>=3.18,<4",
    "pypinyin==0.55.0",
    # pypinyin 依赖 JSON 数据文件，运行时请作为目录放入 runtime/Lib/site-packages，
    # 不要打进 _pure_packages.zip（zipimport 无法 open 压缩包内的 json）。
    "pydantic==2.10.6",
    "apscheduler>=3.10,<4",
    "pynput>=1.7,<2",
    "packaging>=24",
    "pywin32>=311",
    "keyboard==0.13.5",
    "huggingface_hub>=0.20.0",
    "qrcode>=7.4",
    "tqdm",
    "pyyaml",
    "filelock"
]

[project.urls]
Homepage = "https://www.bm-box.cn"
Repository = "https://github.com/bm-qihengzhi/BmScriptsBox"
Issues = "https://github.com/bm-qihengzhi/BmScriptsBox/issues"


